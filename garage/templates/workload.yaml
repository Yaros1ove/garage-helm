apiVersion: apps/v1
kind: {{ .Values.deployment.kind }}
metadata:
  name: {{ include "garage.fullname" . }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "garage.selectorLabels" . | nindent 6 }}
  {{- if eq .Values.deployment.kind "StatefulSet" }}
  replicas: {{ .Values.deployment.replicaCount }}
  serviceName: {{ include "garage.fullname" . }}-headless
  podManagementPolicy: {{ .Values.deployment.podManagementPolicy }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "garage.config.content" . | sha256sum }}
        {{- /* When garage.secret.create is false the actual secret is externally managed -
        garage.secret.content falls back to a fresh random value on every single render
        (rpcSecret/adminToken default to jupyterhub.randHex when unset), so this checksum
        would never be stable and would force a pointless rolling restart on every sync. */}}
        {{- if .Values.garage.secret.create }}
        checksum/secret: {{ include "garage.secret.content" . | sha256sum }}
        {{- end }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "garage.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "garage.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.metaRestore.enabled }}
      initContainers:
        - name: restore-meta
          image: "{{ .Values.metaRestore.image.repository }}:{{ .Values.metaRestore.image.tag }}"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              META=/mnt/meta
              SNAPDIR={{ .Values.garage.metadataSnapshotsDir | quote }}

              if [ -f "$META/db.lmdb/data.mdb" ]; then
                echo "[restore] meta present -> skip"; exit 0
              fi

              SNAPSHOT_NAME="{{ .Values.metaRestore.snapshotName | default "latest" }}"
              if [ "$SNAPSHOT_NAME" != "latest" ]; then
                LATEST="$SNAPDIR/$SNAPSHOT_NAME/"
                if [ ! -d "$LATEST" ] || [ ! -f "${LATEST}db.lmdb" ]; then
                  echo "[restore] specified snapshot not found: $SNAPSHOT_NAME -> fresh start"
                  exit 0
                fi
              else
                LATEST=$(ls -1d "$SNAPDIR"/*/ 2>/dev/null | sort | tail -n1 || true)
                if [ -z "${LATEST:-}" ] || [ ! -f "${LATEST}db.lmdb" ]; then
                  echo "[restore] no snapshot -> fresh start"; exit 0
                fi
              fi

              echo "[restore] restoring from ${LATEST}"
              mkdir -p "$META/db.lmdb"
              cp "${LATEST}db.lmdb" "$META/db.lmdb/data.mdb"
              echo "[restore] done"
          volumeMounts:
            - { name: meta, mountPath: /mnt/meta }
            - { name: snapshots, mountPath: {{ .Values.garage.metadataSnapshotsDir }} }
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3900
              name: s3-api
            - containerPort: 3901
              name: rpc
            - containerPort: 3902
              name: s3-web
            - containerPort: 3903
              name: admin
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "garage.secretName" . }}
                  key: rpcSecret
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "garage.secretName" . }}
                  key: adminToken
            {{- with .Values.environment }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: meta
              mountPath: /mnt/meta
            - name: data
              mountPath: /mnt/data
            - name: snapshots
              mountPath: {{.Values.garage.metadataSnapshotsDir}}
            - name: configmap
              mountPath: /etc/garage.toml
              subPath: garage.toml
          {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: configmap
          configMap:
            name: {{ include "garage.fullname" . }}-config
        {{- if .Values.persistence.enabled }}
        {{- if eq .Values.deployment.kind "DaemonSet" }}
        - name: meta
          hostPath:
            path: {{ .Values.persistence.meta.hostPath }}
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: {{ .Values.persistence.data.hostPath }}
            type: DirectoryOrCreate
        - name: snapshots
          hostPath:
            path: {{ .Values.persistence.snapshots.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
        {{- else }}
        - name: meta
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: snapshots
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (eq .Values.deployment.kind "StatefulSet") }}
  volumeClaimTemplates:
  - metadata:
      name: meta
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- with .Values.persistence.meta.storageClass }}
      storageClassName: {{ . | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.meta.size | quote }}
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- with .Values.persistence.data.storageClass }}
      storageClassName: {{ . | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.data.size | quote }}
  - metadata:
      name: snapshots
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- with .Values.persistence.snapshots.storageClass }}
      storageClassName: {{ . | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.snapshots.size | quote }}
  {{- end }}
